version: "3.9"

services:
  fastapi:
    build: 
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: yamyam-fastapi
    ports:
      - "8000:8000"
    environment:
      # 데이터베이스 설정
      DATABASE_URL: postgresql://yamyam:yamyam_pass@postgres:5432/yamyamdb
      REDIS_URL: redis://redis:6379
      
      # JWT 설정
      JWT_SECRET_KEY: your-secret-key-here-change-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      
      # 환경 설정
      ENVIRONMENT: development
      DEBUG: True
      LOG_LEVEL: INFO
      
      # CORS 설정
      ALLOWED_ORIGINS: '["http://localhost:8501", "http://localhost:3000", "http://localhost"]'
      
      # Firebase 설정
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-key.json
      
      # 서버 설정
      WORKERS: ${WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./fastapi:/app
      - ./fastapi/firebase-service-account-key.json:/app/firebase-key.json

  postgres:
    image: postgres:15
    container_name: yamyam-postgres
    environment:
      POSTGRES_USER: yamyam
      POSTGRES_PASSWORD: yamyam_pass
      POSTGRES_DB: yamyamdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamyam -d yamyamdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: yamyam-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: