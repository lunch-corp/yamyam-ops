version: "3.9"

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: yamyam-backend
    ports:
      - "8000:8000"
    # 메모리 제한 설정 (메모리 누수 방지)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    environment:
      # 데이터베이스 설정
      DATABASE_URL: postgresql://yamyam:yamyam_pass@postgres:5432/yamyamdb
      REDIS_URL: redis://redis:6379
      
      # JWT 설정
      JWT_SECRET_KEY: your-secret-key-here-change-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      
      # 환경 설정
      ENVIRONMENT: development
      DEBUG: True
      LOG_LEVEL: INFO
      
      # CORS 설정
      ALLOWED_ORIGINS: '["http://localhost:8501", "http://localhost:3000", "http://localhost"]'
      
      # Firebase 설정
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-key.json
      
      # 서버 설정
      WORKERS: ${WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/firebase-service-account-key.json:/app/firebase-key.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15
    container_name: yamyam-postgres
    environment:
      POSTGRES_USER: yamyam
      POSTGRES_PASSWORD: yamyam_pass
      POSTGRES_DB: yamyamdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamyam -d yamyamdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: yamyam-redis
    ports:
      - "6379:6379"
    # 메모리 제한 설정
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    # Redis 메모리 정책 설정 (메모리 부족 시 오래된 키 자동 삭제)
    command: redis-server --maxmemory 768m --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: