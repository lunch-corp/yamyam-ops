[project]
name = "yamyam-fastapi"
version = "0.1.0"
description = "FastAPI application for yamyam-ops"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "psycopg2-binary==2.9.9",
    "sqlalchemy==2.0.23",
    "pydantic==2.11.9",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.6",
    "httpx==0.25.2",
    "redis==5.0.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-dotenv>=1.0.0",
    "pandas==2.1.3",
    "firebase-admin==6.4.0",
    "python-ulid==3.1.0",
    "faiss-cpu==1.7.4",
    "paramiko==3.4.0",
    "fuzzywuzzy>=0.18.0",
    "yamyam-lab @ git+https://github.com/lunch-corp/yamyam-lab.git@v1.0.6",
    "jamo==0.4.1",
]


[tool.uv.extra-build-dependencies]
kiwipiepy = ["numpy"]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "ruff==0.9.9",
    "pre-commit>=4.0,<5.0",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 88
indent-width = 4
target-version = "py311"
lint.select = ["E4", "E7", "E9", "F", "I", "UP006"]
lint.ignore = ["E722", "F403", "F405", "E501"]
lint.fixable = ["ALL"]
lint.unfixable = []
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
format.quote-style = "double"
format.indent-style = "space"
format.skip-magic-trailing-comma = false
format.line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
